<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>MI-Aréna Web v1.2</title>
<style>
:root{--bg:#1b1d1f;--bar:#111;--panel:#262a2d;--head:#33383c;--fg:#e8efe0;--mut:#9aa5ab;--acc:#4fc3f7;--ok:#2e7d32;--err:#ef5350;--line:#3d4348;--echo:#81d4fa;--code:#15181a;--in:#202325}
:root[data-theme=light]{--bg:#eceff1;--bar:#fff;--panel:#fff;--head:#e3e8eb;--fg:#15191c;--mut:#5d6b73;--acc:#0b6bb5;--ok:#2e7d32;--err:#c62828;--line:#cfd6db;--echo:#0055cc;--code:#f1f4f6;--in:#fafafa}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--head);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:active{filter:brightness(1.15)}
button.danger{color:var(--err)}
.bar{display:flex;align-items:center;justify-content:space-between;background:var(--bar);padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:17px}
.brand small{color:var(--mut);font-weight:400}
.bar-btns{display:flex;gap:6px}
.bar-btns button{min-width:38px;min-height:36px;font-size:16px}
.navrow{display:flex;align-items:center;gap:6px;padding:8px 8px 4px;flex:0 0 auto}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;max-width:72vw;display:flex;align-items:center;gap:7px;background:var(--head);border:1px solid var(--line);border-radius:999px;font-size:13px;padding:3px 12px 3px 8px;cursor:pointer}
.chip .cl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:3px 0}
.chip .ck{width:20px;height:20px;margin:0;flex:0 0 auto;accent-color:#2e7d32}
.chip.off{opacity:.55}
.chip.off .cl{text-decoration:line-through}
.panel.off .pbody{opacity:.5}
.chip.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tier{flex:0 0 auto;border-radius:999px;font-weight:700;padding:5px 12px;font-size:13px;white-space:nowrap;color:#fff}
.tier.strong{background:#6a1b9a;border-color:#6a1b9a}
.tier.cheap{background:#00695c;border-color:#00695c}
.mlbl{font-size:12px;color:var(--mut);margin-bottom:-2px}
.deck{flex:1;min-height:0;display:flex;gap:8px;padding:4px 8px 8px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.panel{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media (min-width:900px){.panel{flex:1 0 380px;scroll-snap-align:start}.chip{max-width:30vw}}
.ic.on{background:var(--ok);border-color:var(--ok);color:#fff}
.src{font-size:12px;color:var(--mut);margin:-6px 0 12px}
.src ol{margin:2px 0 0;padding-left:20px}
.src a{color:var(--acc);overflow-wrap:anywhere}
.fback{display:none}
html.full,body.full{height:auto}
body.full{display:block;overflow:auto}
body.full .bar,body.full .navrow,body.full .composer{display:none}
body.full .deck{display:block;overflow:visible;padding:8px}
body.full .panel{display:none}
body.full .panel.fp{display:block;overflow:visible}
body.full .panel.fp .pbody{overflow:visible}
body.full .fback{display:block;margin:4px 8px 24px;width:calc(100% - 16px);padding:12px}
.phead{display:flex;align-items:center;gap:6px;background:var(--head);padding:6px 8px;flex:0 0 auto}
.pname{font-weight:700;color:var(--acc)}
.pmodel{color:var(--mut);font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmode{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--mut)}
.phead button{padding:2px 8px;font-size:14px}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:12px;position:relative;-webkit-overflow-scrolling:touch}
.hint{color:var(--mut);text-align:center;margin-top:20px;font-size:14px}
.msg.user{color:var(--echo);font-style:italic;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px;overflow-wrap:anywhere}
.msg.user .fl{font-size:12px;color:var(--mut);font-style:normal;margin-top:4px}
.meta{color:var(--mut);font-size:11px;margin:6px 0 14px}
.err{color:var(--err);white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}
.wait{color:var(--mut);margin:8px 0}
.dots{display:inline-block;width:12px;height:12px;border:2px solid var(--mut);border-top-color:transparent;border-radius:50%;vertical-align:-2px;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.md{overflow-wrap:anywhere}
.md p{margin:0 0 10px}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:14px 0 6px;line-height:1.25}
.md h1{font-size:1.35em}.md h2{font-size:1.2em}.md h3,.md h4,.md h5,.md h6{font-size:1.07em}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md blockquote{margin:0 0 10px;padding:2px 10px;border-left:3px solid var(--line);color:var(--mut)}
.md hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.md code{background:var(--code);border-radius:4px;padding:1px 5px;font:13px ui-monospace,Consolas,monospace}
.md .code{position:relative;margin:0 0 10px}
.md .code pre{margin:0;background:var(--code);border-radius:8px;padding:10px;overflow-x:auto}
.md .code pre code{background:none;padding:0;white-space:pre}
.md .code .cp{position:absolute;top:4px;right:4px;font-size:11px;padding:1px 7px;opacity:.85}
.md table{border-collapse:collapse;margin:0 0 10px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.md a{color:var(--acc)}
.composer{flex:0 0 auto;background:var(--bar);border-top:1px solid var(--line);padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.atts{display:flex;gap:6px;overflow-x:auto;margin-bottom:6px}
.atts:empty{display:none}
.att{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--head);border:1px solid var(--line);border-radius:8px;padding:3px 6px;font-size:12px;max-width:200px}
.att img{width:34px;height:34px;object-fit:cover;border-radius:4px}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att button{padding:0 6px;border:0;background:none;font-size:16px}
.crow{display:flex;gap:6px;align-items:flex-end}
.crow textarea{flex:1;min-width:0;resize:none;max-height:140px;background:var(--in);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ic{min-width:40px;min-height:40px;font-size:18px}
.send{min-height:40px;background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700;padding:0 14px}
.send.stop{background:var(--err);border-color:var(--err)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;max-width:90vw;z-index:50;pointer-events:none}
dialog{width:min(680px,96vw);max-height:92dvh;padding:0;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--fg)}
dialog::backdrop{background:#0008}
.dlg-in{display:flex;flex-direction:column;max-height:92dvh}
.dlg-body{overflow-y:auto;padding:14px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.dlg-body h2{margin:0 0 8px}
.dlg-body h3{margin:16px 0 6px;color:var(--acc)}
.note{color:var(--mut);font-size:13px;margin:0 0 10px}
.fld{display:block;margin-bottom:10px}
.fld>span{display:block;font-size:13px;color:var(--mut);margin-bottom:2px}
.fld input,.srow select{width:100%;background:var(--in);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.inl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.inl input{flex:1;min-width:0}
.srow{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;display:grid;gap:6px}
.sline{display:flex;justify-content:space-between;align-items:center}
.chk{display:flex;gap:6px;align-items:center}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">⚔️ MI-Aréna <small>Web v1.2</small></div>
  <div class="bar-btns">
    <button id="bExp" title="Mentés szövegfájlba">⬇</button>
    <button id="bClear" title="Új beszélgetés (mind)">🗑</button>
    <button id="bTheme" title="Világos / sötét">🌓</button>
    <button id="bSet" title="Beállítások">⚙</button>
  </div>
</header>
<div class="navrow"><button id="bTier" class="tier cheap" type="button" title="Váltás az erős és az olcsó modellek között">💰 Olcsó</button><nav id="chips" class="chips"></nav></div>
<main id="deck" class="deck"></main>
<footer class="composer">
  <div id="atts" class="atts"></div>
  <div class="crow">
    <button id="bAtt" class="ic" title="Kép / PDF / szövegfájl csatolása">📎</button>
    <button id="bWeb" class="ic" type="button" title="Webes keresés (a küldéskor mindhárom AI-nál)">🌐</button>
    <textarea id="inp" rows="1" placeholder="Kérdés…"></textarea>
    <button id="bSend" class="send">Küldés</button>
  </div>
  <input id="file" type="file" hidden multiple accept="image/*,application/pdf,.pdf,.txt,.md,.csv,.json,.py,.js,.ts,.html,.css,.xml,.yml,.yaml,.ini,.log,.sql,.bat,.sh,.cfg,.toml">
</footer>
<button id="fBack" class="fback" type="button">↩ Vissza a lapozható nézethez</button>
<dialog id="dlg"><div class="dlg-in"><div id="dlgBody" class="dlg-body"></div><div class="dlg-foot"><button type="button" id="dCancel">Mégse</button><button type="button" id="dSave" class="send">Mentés</button></div></div></dialog>

<script>
(() => {
'use strict';

/* ============ Alapok ============ */
const LS_KEY = 'miarena.v1';
const MAX_SLOTS = 9;
const MAX_FILES = 6;
const MAX_PDF_BYTES = 10 * 1024 * 1024;
const MAX_TEXT_CHARS = 200000;
const TEXT_EXT = ['txt','md','csv','json','py','js','ts','html','css','xml','yml','yaml','ini','log','sql','bat','sh','cfg','toml'];

const MODES = {
  'Gyors': 'Segítőkész asszisztens vagy.',
  'Gondolkodó': 'Segítőkész asszisztens vagy. A választ így építsd fel: az első 2-3 mondatban tömören, közvetlenül add meg a lényeget (a kérdésre adott választ), utána következzen a részletesebb, jól tagolt kifejtés (rövid alcímek, felsorolások, példák, ahol segítenek). Ne írd le, hogyan jutottál a válaszhoz, ne meséld a gondolatmenetedet. Ha valamiben bizonytalan vagy, a végén jelezd. A kérdés nyelvén válaszolj.',
  'Kódoló': 'Szakértő programozó vagy. Csak tiszta kódot írj!'
};

/* Új szolgáltató felvételéhez: ide kerül egy új bejegyzés + egy call/list függvény */
const PROVIDERS = {
  gemini:    { label: 'Gemini', keyLabel: 'Gemini API-kulcs', strong: 'gemini-3.1-pro-preview', cheap: 'gemini-3.8-flash',
               suggest: ['gemini-3.1-pro-preview', 'gemini-4-argon', 'gemini-pro-latest', 'gemini-3.8-flash', 'gemini-3.5-flash-lite', 'gemini-3.1-flash-lite'],
               call: callGemini, list: listGemini },
  openai:    { label: 'GPT',    keyLabel: 'OpenAI (GPT) API-kulcs', strong: 'gpt-6-astra', cheap: 'gpt-6-luna',
               suggest: ['gpt-6-astra', 'gpt-6.1-sol', 'gpt-6-sol', 'gpt-6-luna', 'gpt-5.5-pro', 'gpt-5.5'],
               call: callOpenAI, list: listOpenAI },
  anthropic: { label: 'Claude', keyLabel: 'Anthropic (Claude) API-kulcs', strong: 'claude-fable-5-1', cheap: 'claude-haiku-5-5',
               suggest: ['claude-fable-5-1', 'claude-opus-5-5', 'claude-sonnet-5-5', 'claude-haiku-5-5'],
               call: callAnthropic, list: listAnthropic }
};
const MODE_HINT = { 'Gondolkodó': 'Gondolkodó (lényeg, majd részletek)' };
const SEARCH_HINT = ' Ha a kérdéshez friss vagy ellenőrizendő információ kell, használd a webes keresést.';
const TIERS = { strong: { icon: '💪', label: 'Erős' }, cheap: { icon: '💰', label: 'Olcsó' } };

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

/* ============ Beállítások tárolása ============ */
function slotDefault(id, provider) {
  const P = PROVIDERS[provider];
  return { id, provider, models: { strong: P.strong, cheap: P.cheap }, mode: 'Gyors', active: true, send: true };
}
function defaults() {
  return {
    theme: null,
    tier: 'cheap',
    search: false,
    keys: { gemini: '', openai: '', anthropic: '' },
    maxTokens: 4096,
    models: {},
    nextId: 4,
    slots: [slotDefault(1, 'gemini'), slotDefault(2, 'openai'), slotDefault(3, 'anthropic')]
  };
}
function loadSettings() {
  const d = defaults();
  try {
    const raw = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (raw && typeof raw === 'object') {
      if (raw.theme) d.theme = raw.theme;
      if (raw.tier === 'strong' || raw.tier === 'cheap') d.tier = raw.tier;
      d.search = raw.search === true;
      if (raw.keys) Object.keys(d.keys).forEach(k => { if (typeof raw.keys[k] === 'string') d.keys[k] = raw.keys[k]; });
      if (raw.maxTokens) d.maxTokens = +raw.maxTokens || 4096;
      if (raw.models && typeof raw.models === 'object') d.models = raw.models;
      if (Array.isArray(raw.slots) && raw.slots.length) {
        d.slots = raw.slots.filter(s => PROVIDERS[s.provider]).map(s => {
          const P = PROVIDERS[s.provider], m = s.models || {};   // a régi (1.0-s) mentésben nincs "models": ott az ajánlott pár kerül be
          return { id: +s.id, provider: s.provider,
                   models: { strong: String(m.strong || P.strong), cheap: String(m.cheap || P.cheap) },
                   mode: MODES[s.mode] ? s.mode : 'Gyors', active: !!s.active, send: s.send !== false };
        });
        if (!d.slots.length) d.slots = defaults().slots;
        d.nextId = Math.max(d.nextId, raw.nextId || 0, ...d.slots.map(s => s.id + 1));
      }
    }
  } catch (e) {}
  return d;
}
const modelOf = s => (s.models && s.models[S.tier]) || PROVIDERS[s.provider][S.tier];
function saveSettings() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { toast('A beállítások mentése nem sikerült.'); } }

let S = loadSettings();
const convo = {};                // slotId -> { history:[], view:[] }
let attachments = [];            // csatolt fájlok a következő küldéshez
let busy = false;
let controllers = [];
const getConvo = id => convo[id] || (convo[id] = { history: [], view: [] });

/* ============ Kis segédek ============ */
let toastTimer;
function toast(msg) {
  let t = document.querySelector('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3200);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Vágólapra másolva'); return; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('Vágólapra másolva'); } catch (e) { toast('A másolás nem sikerült.'); }
  ta.remove();
}
function applyTheme() {
  const th = S.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', th);
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = th === 'light' ? '#ffffff' : '#111111';
}

/* ============ Markdown (biztonságos: előbb escape, utána formázás) ============ */
// <md>
function mdInline(s) {
  const codes = [];
  s = s.replace(/`([^`\n]+)`/g, (m, c) => { codes.push(c); return '\u0002' + (codes.length - 1) + '\u0002'; });
  s = s.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s = s.replace(/\u0002(\d+)\u0002/g, (m, i) => '<code>' + codes[+i] + '</code>');
  return s;
}
function mdRow(line) {
  let s = line.trim();
  if (s.startsWith('|')) s = s.slice(1);
  if (s.endsWith('|')) s = s.slice(0, -1);
  return s.split('|').map(c => c.trim());
}
function md(src) {
  const blocks = [];
  src = String(src || '').replace(/\r/g, '').replace(/```([\w+#.-]*)[ \t]*\n?([\s\S]*?)(```|$)/g, (m, lang, code) => {
    blocks.push(code.replace(/\n$/, ''));
    return '\n\u0001' + (blocks.length - 1) + '\u0001\n';
  });
  const lines = esc(src).split('\n');
  const out = [];
  let para = [], list = null;
  const flushPara = () => { if (para.length) { out.push('<p>' + mdInline(para.join('<br>')) + '</p>'); para = []; } };
  const flushList = () => { if (list) { out.push('<' + list.t + '>' + list.items.map(i => '<li>' + mdInline(i) + '</li>').join('') + '</' + list.t + '>'); list = null; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    let m;
    if ((m = line.match(/^\u0001(\d+)\u0001$/))) {
      flushPara(); flushList();
      out.push('<div class="code"><button class="cp" type="button">Másol</button><pre><code>' + esc(blocks[+m[1]]) + '</code></pre></div>');
      continue;
    }
    if (!line.trim()) { flushPara(); flushList(); continue; }
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { flushPara(); flushList(); out.push('<h' + m[1].length + '>' + mdInline(m[2]) + '</h' + m[1].length + '>'); continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flushPara(); flushList(); out.push('<hr>'); continue; }
    if (line.indexOf('|') >= 0 && i + 1 < lines.length && /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(lines[i + 1])) {
      flushPara(); flushList();
      const head = mdRow(line);
      let j = i + 2; const rows = [];
      while (j < lines.length && lines[j].indexOf('|') >= 0 && lines[j].trim()) { rows.push(mdRow(lines[j])); j++; }
      out.push('<table><thead><tr>' + head.map(c => '<th>' + mdInline(c) + '</th>').join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map(c => '<td>' + mdInline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>');
      i = j - 1; continue;
    }
    if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) { flushPara(); if (!list || list.t !== 'ul') { flushList(); list = { t: 'ul', items: [] }; } list.items.push(m[1]); continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { flushPara(); if (!list || list.t !== 'ol') { flushList(); list = { t: 'ol', items: [] }; } list.items.push(m[1]); continue; }
    if ((m = line.match(/^&gt;\s?(.*)$/))) { flushPara(); flushList(); out.push('<blockquote>' + mdInline(m[1]) + '</blockquote>'); continue; }
    flushList();
    para.push(line.trim());
  }
  flushPara(); flushList();
  return out.join('');
}
// </md>

/* ============ Panelek (swipe) ============ */
const deck = $('deck');
let io = null;

function viewHtml(view) {
  if (!view.length) return '<div class="hint">Itt jelenik meg a válasz.</div>';
  return view.map(v => {
    switch (v.role) {
      case 'user': return '<div class="msg user">👤 ' + esc(v.text).replace(/\n/g, '<br>') + (v.files && v.files.length ? '<div class="fl">📎 ' + esc(v.files.join(', ')) + '</div>' : '') + '</div>';
      case 'wait': return '<div class="wait"><span class="dots"></span> gondolkodik…</div>';
      case 'ai':   return '<div class="msg ai md">' + md(v.text) + '</div><div class="meta">' + esc(v.meta || '') + '</div>' +
        (v.sources && v.sources.length ? '<div class="src">🌐 Források:<ol>' + v.sources.map(x => '<li><a href="' + esc(x.url) + '" target="_blank" rel="noopener noreferrer">' + esc(x.title) + '</a></li>').join('') + '</ol></div>' : '');
      case 'err':  return '<div class="err">❌ ' + esc(v.text) + '</div>';
      default: return '';
    }
  }).join('');
}
function paintBody(id) {

function readB64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1] || '');
    r.onerror = () => rej(new Error('Nem sikerült beolvasni: ' + file.name));
    r.readAsDataURL(file);
  });
}
async function processImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('Nem megnyitható kép: ' + file.name)); img.src = url; });
    const max = 1280, w = img.naturalWidth, h = img.naturalHeight, sc = Math.min(1, max / Math.max(w, h));
    const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(w * sc)); cv.height = Math.max(1, Math.round(h * sc));
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
    const dataUrl = cv.toDataURL('image/jpeg', 0.85);
    return { kind: 'image', name: file.name || 'kep.jpg', mime: 'image/jpeg', b64: dataUrl.split(',')[1], thumb: dataUrl };
  } finally { URL.revokeObjectURL(url); }
}
async function addFiles(list) {
  for (const f of Array.from(list)) {
    if (attachments.length >= MAX_FILES) { toast('Legfeljebb ' + MAX_FILES + ' fájl csatolható.'); break; }
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    try {
      if (f.type.startsWith('image/')) attachments.push(await processImage(f));
      else if (f.type === 'application/pdf' || ext === 'pdf') {
        if (f.size > MAX_PDF_BYTES) { toast(f.name + ': a PDF túl nagy (max. 10 MB).'); continue; }
        attachments.push({ kind: 'pdf', name: f.name, mime: 'application/pdf', b64: await readB64(f) });
      } else if (f.type.startsWith('text/') || TEXT_EXT.includes(ext)) {
        let t = await f.text();
        if (t.length > MAX_TEXT_CHARS) { t = t.slice(0, MAX_TEXT_CHARS) + '\n[…a fájl többi része levágva]'; toast(f.name + ': hosszú fájl, levágtam.'); }
        attachments.push({ kind: 'text', name: f.name, text: t });
      } else toast(f.name + ': ez a fájltípus nem támogatott.');
    } catch (e) { toast(e.message || 'Hiba a fájl feldolgozásakor.'); }
  }
  renderAtts();
}
function renderAtts() {
  $('atts').innerHTML = attachments.map((a, i) =>
    '<div class="att">' + (a.kind === 'image' ? '<img alt="" src="' + a.thumb + '">' : '<b>' + (a.kind === 'pdf' ? 'PDF' : 'TXT') + '</b>') +
    '<span>' + esc(a.name) + '</span><button type="button" data-i="' + i + '" title="Eltávolítás">×</button></div>').join('');
}

/* ============ Szolgáltatók ============ */
async function httpError(res) {
  let msg = '';
  try { const j = await res.json(); msg = (j.error && (j.error.message || j.error)) || j.message || JSON.stringify(j).slice(0, 300); }
  catch (e) { msg = res.statusText || ''; }
  if (typeof msg !== 'string') msg = JSON.stringify(msg).slice(0, 300);
  const err = new Error('HTTP ' + res.status + ': ' + msg);
  err.status = res.status;
  return err;
}
const tokStr = (a, b) => (a != null ? a : '?') + ' → ' + (b != null ? b : '?') + ' token';
const byNewest = (a, b) => b.localeCompare(a, 'en', { numeric: true });
function cleanSources(list) {
  const seen = new Set(), out = [];
  (list || []).forEach(x => {
    const url = x && String(x.url || ''); if (!/^https?:\/\//i.test(url) || seen.has(url)) return;
    seen.add(url);
    let title = String((x.title || '')).trim();
    if (!title) { try { title = new URL(url).hostname; } catch (e) { title = url; } }
    out.push({ title: title.slice(0, 140), url });
  });
  return out.slice(0, 12);
}
const searchNote = n => n ? '🌐 ' + n + ' keresés' : '';
const RESP_ONLY = /(^|-)pro($|-)|codex/;   // a -pro és -codex modellek csak a Responses API-n érhetők el

async function callOpenAI(slot, hist, t, sys, signal) {
  const key = S.keys.openai; if (!key) throw new Error('Hiányzik az OpenAI API-kulcs (⚙ Beállítások).');
  if (t.search || RESP_ONLY.test(slot.model)) return openaiResponses(slot, hist, t, sys, signal, key);
  try { return await openaiChat(slot, hist, t, sys, signal, key); }
  catch (e) {
    if (e.status === 404 && /v1\/responses/.test(e.message)) return openaiResponses(slot, hist, t, sys, signal, key);
    throw e;
  }
}
async function openaiChat(slot, hist, t, sys, signal, key) {
  const imgs = t.files.filter(f => f.kind === 'image'), pdfs = t.files.filter(f => f.kind === 'pdf');
  let content = t.fullText;
  if (imgs.length || pdfs.length) {
    content = [{ type: 'text', text: t.fullText }]
      .concat(imgs.map(f => ({ type: 'image_url', image_url: { url: 'data:' + f.mime + ';base64,' + f.b64 } })))
      .concat(pdfs.map(f => ({ type: 'file', file: { filename: f.name, file_data: 'data:application/pdf;base64,' + f.b64 } })));
  }
  const body = { model: slot.model, messages: [{ role: 'system', content: sys }].concat(hist.map(h => ({ role: h.role, content: h.text })), [{ role: 'user', content }]) };
  const res = await fetch('https://api.openai.com/v1/chat/completions', { method: 'POST', signal, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key }, body: JSON.stringify(body) });
  if (!res.ok) throw await httpError(res);
  const d = await res.json(), ch = d.choices && d.choices[0], u = d.usage || {};
  return { text: (ch && ch.message && (ch.message.content || ch.message.refusal)) || '', usage: tokStr(u.prompt_tokens, u.completion_tokens), note: ch && ch.finish_reason === 'length' ? 'a válasz elérte a hosszkorlátot' : '' };
}
async function openaiResponses(slot, hist, t, sys, signal, key) {
  const imgs = t.files.filter(f => f.kind === 'image'), pdfs = t.files.filter(f => f.kind === 'pdf');
  const parts = [{ type: 'input_text', text: t.fullText }]
    .concat(imgs.map(f => ({ type: 'input_image', image_url: 'data:' + f.mime + ';base64,' + f.b64 })))
    .concat(pdfs.map(f => ({ type: 'input_file', filename: f.name, file_data: 'data:application/pdf;base64,' + f.b64 })));
  const body = { model: slot.model, instructions: sys, input: hist.map(h => ({ role: h.role, content: h.text })).concat([{ role: 'user', content: parts }]) };
  if (t.search) body.tools = [{ type: 'web_search' }];
  const res = await fetch('https://api.openai.com/v1/responses', { method: 'POST', signal, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key }, body: JSON.stringify(body) });
  if (!res.ok) throw await httpError(res);
  const d = await res.json(), u = d.usage || {};
  const text = (d.output || []).filter(o => o.type === 'message').reduce((a, o) => a.concat(o.content || []), [])
    .map(c => c.type === 'output_text' ? c.text : c.type === 'refusal' ? c.refusal : '').join('');
  const notes = [];
  if (d.status === 'incomplete') notes.push('félbeszakadt: ' + ((d.incomplete_details && d.incomplete_details.reason) || 'ismeretlen ok'));
  const out = d.output || [];
  const nSearch = out.filter(o => o.type === 'web_search_call').length;
  if (t.search) notes.push(nSearch ? searchNote(nSearch) : 'nem keresett a weben');
  const sources = cleanSources(out.filter(o => o.type === 'message').reduce((a, o) => a.concat(o.content || []), [])
    .reduce((a, c) => a.concat(c.annotations || []), []).filter(an => an.type === 'url_citation'));
  return { text, usage: tokStr(u.input_tokens, u.output_tokens), note: notes.join(' · '), sources };
}

async function callAnthropic(slot, hist, t, sys, signal) {
  const key = S.keys.anthropic; if (!key) throw new Error('Hiányzik az Anthropic (Claude) API-kulcs (⚙ Beállítások).');
  const imgs = t.files.filter(f => f.kind === 'image'), pdfs = t.files.filter(f => f.kind === 'pdf');
  const content = imgs.map(f => ({ type: 'image', source: { type: 'base64', media_type: f.mime, data: f.b64 } }))
    .concat(pdfs.map(f => ({ type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: f.b64 } })))
    .concat([{ type: 'text', text: t.fullText }]);
  let msgs = hist.map(h => ({ role: h.role, content: h.text })).concat([{ role: 'user', content }]);
  const body = { model: slot.model, max_tokens: S.maxTokens || 4096, system: sys, messages: msgs };
  if (t.search) body.tools = [{ type: 'web_search_20250305', name: 'web_search', max_uses: 5 }];
  let text = '', tin = 0, tout = 0, nSearch = 0, last = null, found = [];
  for (let round = 0; round < 4; round++) {     // pause_turn: a hosszú keresési kört folytatni kell
    body.messages = msgs;
    const res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', signal, headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, body: JSON.stringify(body) });
    if (!res.ok) throw await httpError(res);
    const d = await res.json(), u = d.usage || {}, blocks = d.content || [];
    last = d; tin += u.input_tokens || 0; tout += u.output_tokens || 0;
    nSearch += (u.server_tool_use && u.server_tool_use.web_search_requests) || 0;
    text += blocks.filter(p => p.type === 'text').map(p => p.text).join('');
    blocks.forEach(p => {
      if (p.type === 'web_search_tool_result' && Array.isArray(p.content)) found = found.concat(p.content.filter(r => r.type === 'web_search_result'));
      if (p.type === 'text' && Array.isArray(p.citations)) found = found.concat(p.citations.filter(c => c.url));
    });
    if (d.stop_reason === 'pause_turn') { msgs = msgs.concat([{ role: 'assistant', content: blocks }]); continue; }
    break;
  }
  const notes = [];
  if (last.stop_reason === 'max_tokens') notes.push('a válasz elérte a max. hosszt (⚙-ben emelhető)');
  if (last.stop_reason === 'pause_turn') notes.push('a keresés félbeszakadt, a válasz hiányos lehet');
  if (t.search) notes.push(nSearch ? searchNote(nSearch) : 'nem keresett a weben');
  return { text, usage: tokStr(tin, tout), note: notes.join(' · '), sources: cleanSources(found) };
}

async function callGemini(slot, hist, t, sys, signal) {
  const key = S.keys.gemini; if (!key) throw new Error('Hiányzik a Gemini API-kulcs (⚙ Beállítások).');
  const model = slot.model.replace(/^models\//, '').replace(/^gemini\//, '');
  const parts = [{ text: t.fullText }].concat(t.files.filter(f => f.kind === 'image' || f.kind === 'pdf').map(f => ({ inline_data: { mime_type: f.mime, data: f.b64 } })));
  const body = {
    system_instruction: { parts: [{ text: sys }] },
    contents: hist.map(h => ({ role: h.role === 'assistant' ? 'model' : 'user', parts: [{ text: h.text }] })).concat([{ role: 'user', parts }])
  };
  if (t.search) body.tools = [{ google_search: {} }];
  const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', { method: 'POST', signal, headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key }, body: JSON.stringify(body) });
  if (!res.ok) throw await httpError(res);
  const d = await res.json(), c = d.candidates && d.candidates[0], u = d.usageMetadata || {};
  if (!c) throw new Error('Nincs válasz' + (d.promptFeedback && d.promptFeedback.blockReason ? ' (blokkolva: ' + d.promptFeedback.blockReason + ')' : '') + '.');
  const text = ((c.content && c.content.parts) || []).filter(p => p.text && !p.thought).map(p => p.text).join('');
  const notes = [];
  if (c.finishReason && c.finishReason !== 'STOP') notes.push('befejezés oka: ' + c.finishReason);
  const gm = c.groundingMetadata || {};
  if (t.search) notes.push((gm.webSearchQueries || []).length ? searchNote(gm.webSearchQueries.length) : 'nem keresett a weben');
  const sources = cleanSources((gm.groundingChunks || []).map(g => g.web && { url: g.web.uri, title: g.web.title }).filter(Boolean));
  return { text, usage: tokStr(u.promptTokenCount, u.candidatesTokenCount), note: notes.join(' · '), sources };
}

// A lekérdezett listákból kiszűrjük, ami nem szöveges csevegésre való (hang, kép, keresés, robotika stb.)

    .filter(id => !/-\d{4}-\d{2}-\d{2}$/.test(id))

function friendlyError(e) {
  if (e && e.name === 'AbortError') return 'Megszakítva.';
  if (e instanceof TypeError) return 'Hálózati hiba: nincs kapcsolat, vagy a böngésző letiltotta a kérést (CORS).';
  return (e && e.message) || String(e);
}

/* ============ Küldés ============ */
async function runSlot(slot, turn) {
  const c = getConvo(slot.id);
  const eff = Object.assign({}, slot, { model: modelOf(slot) });
  const sys = (MODES[slot.mode] || MODES['Gyors']) + (turn.search ? SEARCH_HINT : '');   // a küldéskor érvényes modell
  c.view.push({ role: 'user', text: turn.prompt, files: turn.names });
  c.view.push({ role: 'wait' });
  paintBody(slot.id);
  const ctrl = new AbortController(); controllers.push(ctrl);
  const t0 = performance.now();
  try {
    const r = await PROVIDERS[slot.provider].call(eff, c.history, turn, sys, ctrl.signal);
    c.view = c.view.filter(v => v.role !== 'wait');
    const sec = ((performance.now() - t0) / 1000).toFixed(1);
    c.view.push({ role: 'ai', model: eff.model, sources: r.sources || [], text: r.text || '(üres válasz)', meta: eff.model + ' · ' + r.usage + ' · ' + sec + ' mp' + (r.note ? ' · ' + r.note : '') });
    c.history.push({ role: 'user', text: turn.prompt + turn.note }, { role: 'assistant', text: r.text });
  } catch (e) {
    c.view = c.view.filter(v => v.role !== 'wait');
    c.view.push({ role: 'err', text: '[' + eff.model + '] ' + friendlyError(e) });
  }
  paintBody(slot.id);
}
function setSendBtn() {
  const b = $('bSend');
  b.textContent = busy ? 'Leállít' : 'Küldés';
  b.classList.toggle('stop', busy);
}
async function send() {
  if (busy) { controllers.forEach(c => c.abort()); return; }
  const text = $('inp').value.trim();
  if (!text && !attachments.length) return;
  const act = S.slots.filter(s => s.active && s.send !== false);
  if (!act.length) { toast(S.slots.some(s => s.active) ? 'Egyik AI-nál sincs pipa – jelölj be legalább egyet.' : 'Nincs aktív ablak (⚙ Beállítások).'); return; }
  const files = attachments.slice();
  const prompt = text || 'Mit tartalmaz a csatolt fájl? Röviden foglald össze.';
  const fullText = prompt + files.filter(f => f.kind === 'text').map(f => '\n\n--- ' + f.name + ' ---\n' + f.text).join('');
  const names = files.map(f => f.name);
  const turn = { prompt, fullText, files, names, search: !!S.search, note: names.length ? '\n[Csatolva: ' + names.join(', ') + ']' : '' };
  $('inp').value = ''; autoGrow(); attachments = []; renderAtts();
  busy = true; controllers = []; setSendBtn();
  await Promise.allSettled(act.map(s => runSlot(s, turn)));
  busy = false; setSendBtn();
}
function updateWebBtn() { $('bWeb').classList.toggle('on', !!S.search); $('bWeb').title = S.search ? 'Webes keresés BE – kikapcsolás' : 'Webes keresés KI – bekapcsolás'; }
$('bWeb').addEventListener('click', () => {
  S.search = !S.search; saveSettings(); updateWebBtn();
  toast(S.search ? '🌐 Webes keresés BE: a következő kérdésnél mindhárom AI kereshet (keresésenként külön díj lehet).' : '🌐 Webes keresés KI');
});
function autoGrow() { const t = $('inp'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px'; }
$('inp').addEventListener('input', autoGrow);
$('inp').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.shiftKey) return;
  if (matchMedia('(pointer:fine)').matches || e.ctrlKey || e.metaKey) { e.preventDefault(); if (!busy) send(); }
});
$('bSend').addEventListener('click', send);

/* ============ Felső gombok ============ */
$('bTheme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  S.theme = cur === 'light' ? 'dark' : 'light'; saveSettings(); applyTheme();
});
$('bClear').addEventListener('click', () => {
  if (busy) { toast('Várd meg a válaszokat, vagy nyomd meg a Leállít gombot.'); return; }
  if (!confirm('Új beszélgetés indul, minden ablak előzménye törlődik. Folytassam?')) return;
  Object.keys(convo).forEach(k => delete convo[k]); renderDeck();
});
$('bExp').addEventListener('click', () => {
  const now = new Date(), pad = n => String(n).padStart(2, '0');
  const stamp = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
  let out = '';
  S.slots.filter(s => s.active).forEach(s => {
    const v = getConvo(s.id).view.filter(x => x.role === 'user' || x.role === 'ai' || x.role === 'err');
    if (!v.length) return;
    out += 'DÁTUM: ' + stamp + '\nMI: ' + PROVIDERS[s.provider].label + ' (' + s.mode + ')\n\n';
    v.forEach(x => { out += (x.role === 'user' ? 'KÉRDÉS:\n' : x.role === 'ai' ? 'VÁLASZ' + (x.model ? ' (' + x.model + ')' : '') + ':\n' : 'HIBA:\n') + x.text + '\n' + (x.sources && x.sources.length ? '\nFORRÁSOK:\n' + x.sources.map(z => '- ' + z.title + ': ' + z.url).join('\n') + '\n' : '') + '\n'; });
    out += '='.repeat(70) + '\n\n';
  });
  if (!out) { toast('Még nincs mit menteni.'); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([out], { type: 'text/plain;charset=utf-8' }));
  a.download = 'Mentett_Beszelgetesek_' + stamp.slice(0, 10) + '.txt';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* ============ Beállítások ablak ============ */
let draft = null;
const dlg = $('dlg');

function modelOptions(provider, current) {
  const set = new Set([].concat(PROVIDERS[provider].suggest, draft.models[provider] || []));
  if (current) set.add(current);
  return Array.from(set);
}
function modelSelect(field, s) {
  const cur = s.models[field];
  const opts = modelOptions(s.provider, cur).map(m => '<option value="' + esc(m) + '"' + (m === cur ? ' selected' : '') + '>' + esc(m) + '</option>').join('');
  return '<span class="mlbl">' + TIERS[field].icon + ' ' + TIERS[field].label + ' modell</span><select data-f="' + field + '">' + opts + '<option value="__custom">✎ Egyéni modellnév…</option></select>';
}
function renderRows() {
  $('rows').innerHTML = draft.slots.map((s, i) =>
    '<div class="srow" data-i="' + i + '"><div class="sline"><label class="chk"><input type="checkbox" data-f="active"' + (s.active ? ' checked' : '') + '> ' + (i + 1) + '. ablak aktív</label>' +
    '<button type="button" class="danger" data-del="' + i + '">Törlés</button></div>' +
    '<select data-f="provider">' + Object.keys(PROVIDERS).map(k => '<option value="' + k + '"' + (k === s.provider ? ' selected' : '') + '>' + esc(PROVIDERS[k].label) + '</option>').join('') + '</select>' +
    modelSelect('strong', s) + modelSelect('cheap', s) +
    '<select data-f="mode">' + Object.keys(MODES).map(k => '<option value="' + k + '"' + (k === s.mode ? ' selected' : '') + '>' + esc(MODE_HINT[k] || k) + '</option>').join('') + '</select></div>').join('');
}
function openSettings() {
  draft = JSON.parse(JSON.stringify(S));
  $('dlgBody').innerHTML = '<h2>Beállítások</h2>' +
    '<p class="note">Az API-kulcsok csak ebben a böngészőben (helyi tárolóban) maradnak, a kódban nincsenek. Minden eszközön külön kell megadni őket. A szolgáltatóknál érdemes költséghatárt beállítani.</p>' +
    Object.keys(PROVIDERS).map(k => '<label class="fld"><span>' + esc(PROVIDERS[k].keyLabel) + '</span><div class="inl"><input type="password" id="key-' + k + '" autocomplete="off" spellcheck="false" value="' + esc(draft.keys[k] || '') + '"><button type="button" class="ic" data-show="' + k + '">👁</button></div></label>').join('') +
    '<label class="fld"><span>Claude max. válaszhossz (token)</span><input type="number" id="maxTok" min="256" max="64000" step="256" value="' + (+draft.maxTokens || 4096) + '"></label>' +
    '<h3>Ablakok</h3><p class="note">Mindegyik AI-nak két modellje van: 💪 erős és 💰 olcsó. A főképernyőn a bal felső gombbal váltasz köztük.</p><div id="rows"></div>' +
    '<div class="inl"><button type="button" id="addSlot">+ Ablak</button><button type="button" id="fetchModels">🔄 Modellek lekérdezése</button></div>' +
    '<div class="inl"><button type="button" id="clearKeys" class="danger">Kulcsok törlése</button></div>';
  renderRows();
  dlg.showModal();
}
function readKeysFromInputs() {
  Object.keys(PROVIDERS).forEach(k => { const el = $('key-' + k); if (el) draft.keys[k] = el.value.trim(); });
  const mt = parseInt($('maxTok').value, 10); draft.maxTokens = mt >= 256 ? mt : 4096;
}
dlg.addEventListener('change', e => {
  const f = e.target.dataset && e.target.dataset.f; if (!f) return;
  const i = +e.target.closest('.srow').dataset.i, s = draft.slots[i];
  if (f === 'active') s.active = e.target.checked;
  else if (f === 'mode') s.mode = e.target.value;
  else if (f === 'provider') { s.provider = e.target.value; s.models = { strong: PROVIDERS[s.provider].strong, cheap: PROVIDERS[s.provider].cheap }; renderRows(); }
  else if (f === 'strong' || f === 'cheap') {
    if (e.target.value === '__custom') { const n = (prompt('Add meg a pontos modellnevet:', s.models[f]) || '').trim(); if (n) s.models[f] = n; renderRows(); }
    else s.models[f] = e.target.value;
  }
});
dlg.addEventListener('click', async e => {
  const t = e.target;
  if (t.dataset.show) { const el = $('key-' + t.dataset.show); el.type = el.type === 'password' ? 'text' : 'password'; return; }
  if (t.dataset.del !== undefined) {
    if (draft.slots.length <= 1) { toast('Legalább egy ablak maradjon.'); return; }
    draft.slots.splice(+t.dataset.del, 1); renderRows(); return;
  }
  if (t.id === 'addSlot') {
    if (draft.slots.length >= MAX_SLOTS) { toast('Legfeljebb ' + MAX_SLOTS + ' ablak lehet.'); return; }
    draft.slots.push(slotDefault(draft.nextId++, 'gemini')); renderRows(); return;
  }
  if (t.id === 'clearKeys') {
    if (!confirm('Törlöd az összes elmentett API-kulcsot erről az eszközről?')) return;
    Object.keys(PROVIDERS).forEach(k => { draft.keys[k] = ''; $('key-' + k).value = ''; }); toast('A kulcsok törlődnek a Mentés után.'); return;
  }
  if (t.id === 'fetchModels') {
    readKeysFromInputs();
    t.disabled = true; t.textContent = 'Lekérdezés…';
    const ok = [], bad = [];
    await Promise.all(Object.keys(PROVIDERS).map(async k => {
      if (!draft.keys[k]) return;
      try { const l = await PROVIDERS[k].list(draft.keys[k]); if (l.length) { draft.models[k] = l; ok.push(PROVIDERS[k].label); } }
      catch (err) { bad.push(PROVIDERS[k].label); }
    }));
    t.disabled = false; t.textContent = '🔄 Modellek lekérdezése';
    renderRows();
    toast((ok.length ? 'Betöltve: ' + ok.join(', ') + '. ' : '') + (bad.length ? 'Hiba: ' + bad.join(', ') + '.' : '') || 'Előbb adj meg legalább egy kulcsot.');
  }
});
$('dCancel').addEventListener('click', () => dlg.close());
$('dSave').addEventListener('click', () => {
  readKeysFromInputs();
  draft.slots.forEach(s => { const P = PROVIDERS[s.provider]; s.models.strong = s.models.strong || P.strong; s.models.cheap = s.models.cheap || P.cheap; });
  S = draft; saveSettings(); dlg.close(); renderDeck(); updateTierBtn(); toast('Beállítások elmentve');
});
$('bSet').addEventListener('click', openSettings);

/* ============ Indulás ============ */
$('bTier').addEventListener('click', () => {
  if (busy) { toast('Várd meg a válaszokat, vagy nyomd meg a Leállít gombot.'); return; }
  S.tier = S.tier === 'strong' ? 'cheap' : 'strong';
  saveSettings(); updateLabels();
  toast(TIERS[S.tier].icon + ' ' + TIERS[S.tier].label + ': ' + S.slots.filter(x => x.active).map(x => modelOf(x)).join(' · '));
});
applyTheme();
renderDeck();
updateTierBtn();
updateWebBtn();
if (!S.keys.gemini && !S.keys.openai && !S.keys.anthropic) setTimeout(() => toast('Első lépés: ⚙ → API-kulcsok megadása'), 600);
})();
</script>
</body>
</html>
